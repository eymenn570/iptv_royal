
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROYAL IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #10131b;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #191e2b;
    padding: 18px;
    font-size: 23px;
    font-weight: bold;
    color: #38a5ff;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

h3 {
    color: #38a5ff;
}

input, button {
    width: 100%;
    padding: 13px;
    margin: 5px 0;
    border: none;
    border-radius: 7px;
}

input {
    background: #252c3b;
    color: white;
}

button {
    background: #168cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    opacity: .7;
}

video {
    width: 100%;
    aspect-ratio: 16/9;
    background: black;
    border-radius: 10px;
}

.player {
    margin-top: 15px;
}

#channelTitle {
    font-size: 19px;
    margin: 12px 0;
}

#status, #epgStatus {
    color: #9baac0;
    font-size: 13px;
    margin: 10px 0;
    overflow-wrap: anywhere;
}

.epg-box {
    background: #1b2332;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}

.epg-item {
    background: #252f40;
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
}

.epg-item small {
    color: #38a5ff;
}

.epg-item p {
    margin-bottom: 0;
    color: #c4d0df;
    font-size: 13px;
}

#channels {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 10px;
    margin-top: 15px;
}

.channel {
    background: #202737;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    min-width: 0;
}

.channel.active {
    outline: 2px solid #168cff;
}

.channel img {
    width: 60px;
    height: 50px;
    object-fit: contain;
    margin: auto auto 8px;
    display: block;
}

.channel-name {
    font-size: 13px;
    overflow-wrap: anywhere;
}

.group {
    color: #9baac0;
    font-size: 11px;
    margin-top: 5px;
}

</style>
</head>

<body>

<header>👑 ROYAL IPTV</header>

<div class="container">

    <h3>📡 M3U Playlist</h3>

    <input
        id="playlistUrl"
        type="url"
        placeholder="M3U URL adresi..."
    >

    <button onclick="loadPlaylist()">
        Playlist Yükle
    </button>

    <div id="status">Playlist bekleniyor...</div>

    <h3>📺 EPG Elektronik Program Rehberi</h3>

    <input
        id="epgUrl"
        type="url"
        placeholder="XMLTV EPG URL adresi..."
    >

    <button onclick="loadEPG()">
        EPG Yükle
    </button>

    <div id="epgStatus">EPG bekleniyor...</div>

    <div class="player">

        <video id="video" controls playsinline></video>

        <div id="channelTitle">
            Kanal seçilmedi
        </div>

    </div>

    <div class="epg-box">

        <h3>📅 Program Rehberi</h3>

        <div id="epgContent">
            Kanal seçilmedi.
        </div>

    </div>

    <h3>📋 Kanallar</h3>

    <input
        id="search"
        placeholder="Kanal ara..."
        oninput="renderChannels()"
    >

    <div id="channels"></div>

</div>

<script>
"use strict";

const video = document.getElementById("video");
const channelsElement = document.getElementById("channels");

let channels = [];
let programs = [];
let hls = null;
let selectedChannel = null;

function setStatus(id, message) {
    document.getElementById(id).textContent = message;
}

// M3U YÜKLE

async function loadPlaylist() {

    const url = document.getElementById("playlistUrl").value.trim();

    if (!url) {
        alert("M3U URL gir!");
        return;
    }

    setStatus("status", "Playlist yükleniyor...");

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.text();

        if (!data.trim().startsWith("#EXTM3U")) {
            throw new Error("Geçersiz M3U dosyası.");
        }

        parseM3U(data);
        renderChannels();

        setStatus("status", channels.length + " kanal yüklendi.");

    } catch (error) {

        setStatus("status", "Hata: " + error.message +
            " | CORS iznini kontrol et.");

    }
}

// M3U PARSER

function parseM3U(data) {

    channels = [];

    const lines = data.split(/\r?\n/);
    let current = null;

    for (const raw of lines) {

        const line = raw.trim();

        if (!line) continue;

        if (line.startsWith("#EXTINF:")) {

            const comma = line.indexOf(",");

            const info = comma >= 0
                ? line.substring(0, comma)
                : line;

            const name = comma >= 0
                ? line.substring(comma + 1).trim()
                : "İsimsiz Kanal";

            function attr(key) {

                const regex = new RegExp(
                    key + '="([^"]*)"', "i"
                );

                const match = info.match(regex);

                return match ? match[1] : "";
            }

            current = {
                name: name,
                id: attr("tvg-id"),
                logo: attr("tvg-logo"),
                group: attr("group-title") || "Diğer",
                url: ""
            };

        } else if (!line.startsWith("#") && current) {

            current.url = line;
            channels.push(current);
            current = null;

        }
    }
}

// XMLTV ZAMAN PARSER

function parseXMLTVTime(value) {

    const match = value.trim().match(
        /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})(?:\s*([+-])(\d{2})(\d{2}))?/
    );

    if (!match) return NaN;

    const [
        ,
        year, month, day,
        hour, minute, second,
        sign, offsetHour, offsetMinute
    ] = match;

    let timestamp = Date.UTC(
        Number(year),
        Number(month) - 1,
        Number(day),
        Number(hour),
        Number(minute),
        Number(second)
    );

    if (sign) {

        let offset =
            (Number(offsetHour) * 60 + Number(offsetMinute)) * 60000;

        timestamp -= sign === "+" ? offset : -offset;
    }

    return timestamp;
}

function formatTime(timestamp) {

    return new Date(timestamp).toLocaleTimeString(
        "tr-TR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}

// XMLTV EPG YÜKLE

async function loadEPG() {

    const url = document.getElementById("epgUrl").value.trim();

    if (!url) {
        alert("EPG URL gir!");
        return;
    }

    setStatus("epgStatus", "EPG yükleniyor...");

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        let text;

        const isGzip =
            url.toLowerCase().split("?")[0].endsWith(".gz") ||
            response.headers.get("Content-Type")?.includes("gzip");

        if (isGzip) {

            if (!("DecompressionStream" in window)) {
                throw new Error("GZIP desteği bu tarayıcıda yok.");
            }

            const stream = response.body.pipeThrough(
                new DecompressionStream("gzip")
            );

            text = await new Response(stream).text();

        } else {

            text = await response.text();

        }

        parseEPG(text);

        setStatus(
            "epgStatus",
            programs.length + " program yüklendi."
        );

        updateEPG();

    } catch (error) {

        setStatus(
            "epgStatus",
            "EPG hatası: " + error.message +
            " | CORS veya XML dosyasını kontrol et."
        );

    }
}

// XMLTV PARSER

function parseEPG(xmlText) {

    const parser = new DOMParser();

    const xml = parser.parseFromString(
        xmlText,
        "application/xml"
    );

    if (xml.querySelector("parsererror")) {
        throw new Error("XML dosyası okunamadı.");
    }

    programs = [];

    const entries = xml.getElementsByTagName("programme");

    for (const item of entries) {

        const titleElement = item.getElementsByTagName("title")[0];

        if (!titleElement) continue;

        const start = parseXMLTVTime(
            item.getAttribute("start") || ""
        );

        const stop = parseXMLTVTime(
            item.getAttribute("stop") || ""
        );

        if (!Number.isFinite(start) ||
            !Number.isFinite(stop) ||
            stop <= start) continue;

        const descElement =
            item.getElementsByTagName("desc")[0];

        programs.push({

            channel: item.getAttribute("channel") || "",

            title: titleElement.textContent.trim(),

            description: descElement
                ? descElement.textContent.trim()
                : "",

            start: start,
            stop: stop

        });
    }

}

// KANAL EŞLEŞTİRME

function normalizeName(name) {

    return name
        .toLocaleLowerCase("tr-TR")
        .replace(/[^a-z0-9ğüşöçıİ]/gi, "");
}

function getChannelPrograms(channel) {

    let matching = [];

    if (channel.id) {

        matching = programs.filter(
            p => p.channel === channel.id
        );

    }

    if (matching.length === 0) {

        const name = normalizeName(channel.name);

        matching = programs.filter(p =>
            normalizeName(p.channel) === name
        );

    }

    return matching.sort((a, b) => a.start - b.start);
}

// EPG GÖSTER

function updateEPG() {

    const content = document.getElementById("epgContent");

    if (!selectedChannel) {

        content.textContent = "Kanal seçilmedi.";
        return;

    }

    if (programs.length === 0) {

        content.textContent = "Önce EPG yükle.";
        return;

    }

    const list = getChannelPrograms(selectedChannel);

    const now = Date.now();

    const current = list.find(
        p => p.start <= now && p.stop > now
    );

    const next = list
        .filter(p => p.start > now)
        .sort((a, b) => a.start - b.start)[0];

    content.innerHTML = "";

    function addProgram(label, program) {

        const box = document.createElement("div");

        box.className = "epg-item";

        if (!program) {

            box.textContent = label + ": Program bulunamadı.";

        } else {

            const small = document.createElement("small");
            small.textContent = label + " • " +
                formatTime(program.start) + " - " +
                formatTime(program.stop);

            const title = document.createElement("h4");
            title.textContent = program.title;

            const desc = document.createElement("p");
            desc.textContent = program.description;

            box.appendChild(small);
            box.appendChild(title);
            box.appendChild(desc);

        }

        content.appendChild(box);
    }

    addProgram("🔴 ŞİMDİ", current);
    addProgram("⏭ SONRAKİ", next);

    if (list.length === 0) {

        content.textContent =
            "Bu kanal için EPG programı bulunamadı. Kanal ID'sini kontrol et.";

    }
}

// KANAL OYNAT

function playChannel(channel, card) {

    selectedChannel = channel;

    document.getElementById("channelTitle").textContent =
        channel.name;

    document.querySelectorAll(".channel").forEach(el => {
        el.classList.remove("active");
    });

    card.classList.add("active");

    if (hls) {
        hls.destroy();
        hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    const url = channel.url;

    if (Hls.isSupported() &&
        /\.m3u8($|[?#])/i.test(url)) {

        hls = new Hls();

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.ERROR, (event, data) => {

            if (data.fatal) {

                setStatus(
                    "status",
                    "Yayın oynatma hatası: " + data.type
                );

            }

        });

    } else {

        video.src = url;

    }

    video.play().catch(() => {

        setStatus(
            "status",
            "Oynatmak için Play tuşuna bas."
        );

    });

    updateEPG();
}

// KANAL LİSTESİ

function renderChannels() {

    channelsElement.innerHTML = "";

    const query = document
        .getElementById("search")
        .value.toLocaleLowerCase("tr-TR");

    channels
        .filter(c =>
            c.name.toLocaleLowerCase("tr-TR").includes(query) ||
            c.group.toLocaleLowerCase("tr-TR").includes(query)
        )
        .forEach(channel => {

            const card = document.createElement("div");

            card.className = "channel";

            const img = document.createElement("img");

            img.alt = "";
            img.src = channel.logo || "";

            img.onerror = () => {
                img.style.display = "none";
            };

            const name = document.createElement("div");

            name.className = "channel-name";
            name.textContent = channel.name;

            const group = document.createElement("div");

            group.className = "group";
            group.textContent = channel.group;

            card.appendChild(img);
            card.appendChild(name);
            card.appendChild(group);

            card.onclick = () => playChannel(channel, card);

            channelsElement.appendChild(card);

        });

}

// EPG SAAT GÜNCELLEME

setInterval(updateEPG, 60000);

</script>

</body>
</html>
